name: Build, Release, and Attest Assets

on:
  push:
    tags:
      - '*.*.*'   # Triggers if you tag exactly like: 2.23.0 or 2.23.0-beta-1
      - 'v*.*.*'  # Triggers if you tag like: v2.23.0 or v2.23.0-beta-1

jobs:
  release:
    name: Create Release and Attest Assets
    runs-on: ubuntu-latest

    # CRITICAL: Give GitHub the required permissions to sign your files
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      # 1. Pull down your repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Tell the server to install Node 22
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 3. Install dependencies and build assets
      # This naturally generates dist/manifest.json from the stable one
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build 

      # Select and validate the actual shipped manifest before signing or publishing it.
      - name: Validate release metadata and prepare manifest
        id: release-metadata
        env:
          KPLEX_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-metadata.mjs --prepare-dist

      # Generate the cryptographic attestations for the selected, validated files.
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      # 7. Automatically create a GitHub Release and attach the files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/main.js
            dist/styles.css
            dist/manifest.json
          prerelease: ${{ steps.release-metadata.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
