name: Verify refactor boundaries and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      KPLEX_TEST_BROWSER: /usr/bin/google-chrome
      VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run verify
